<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo Rounded Squircle App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#neonGreen)" stroke-width="8" opacity="0.6" />

  <!-- Scudo FUT esterno con bagliore -->
  <path d="M 256 60 L 410 110 L 375 360 L 256 450 L 137 360 L 102 110 Z" 
        fill="#09090b" stroke="url(#shieldGold)" stroke-width="14" filter="url(#glow)" />

  <path d="M 256 75 L 395 120 L 362 348 L 256 430 L 150 348 L 117 120 Z" 
        fill="#0f172a" stroke="url(#neonGreen)" stroke-width="4" opacity="0.8" />

  <!-- Pallone da Calcio Stilizzato -->
  <circle cx="256" cy="240" r="95" fill="#f8fafc" stroke="#22c55e" stroke-width="8" />

  <!-- Esagoni Pallone -->
  <!-- Centro -->
  <polygon points="256,205 288,228 276,266 236,266 224,228" fill="#09090b" />
  <!-- Linee connettori -->
  <line x1="256" y1="205" x2="256" y2="155" stroke="#09090b" stroke-width="7" />
  <line x1="288" y1="228" x2="335" y2="215" stroke="#09090b" stroke-width="7" />
  <line x1="276" y1="266" x2="305" y2="310" stroke="#09090b" stroke-width="7" />
  <line x1="236" y1="266" x2="207" y2="310" stroke="#09090b" stroke-width="7" />
  <line x1="224" y1="228" x2="177" y2="215" stroke="#09090b" stroke-width="7" />

  <!-- Badge / Stelle e Scritta FUT -->
  <rect x="186" y="355" width="140" height="38" rx="10" fill="url(#shieldGold)" stroke="#fef08a" stroke-width="2" />
  <text x="256" y="381" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle" letter-spacing="3">CALCETTO</text>
</svg>
